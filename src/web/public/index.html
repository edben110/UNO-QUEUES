<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNO.js</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="logo">UNO<span>.js</span></div>
    <div class="topbar-right">
      <span id="gameInfo" class="muted"></span>
      <span id="conn" class="dot" title="Conexión"></span>
      <button id="leaveBtn" class="btn ghost small" hidden>Salir</button>
    </div>
  </header>

  <main>
    <!-- Entrada -->
    <section id="screenJoin" class="screen card-panel center">
      <h1>¡Vamos a jugar!</h1>
      <p class="muted">Escribe tu nombre para entrar a la partida.</p>
      <form id="joinForm">
        <input id="nameInput" maxlength="20" placeholder="Tu nombre" autocomplete="off" required>
        <button class="btn primary" type="submit">Entrar</button>
      </form>
      <p id="joinError" class="error" role="alert"></p>
    </section>

    <!-- Sala de espera -->
    <section id="screenLobby" class="screen card-panel center" hidden>
      <h1>Sala de espera</h1>
      <p class="muted">Se necesitan al menos 2 jugadores.</p>
      <ul id="lobbyPlayers" class="chips"></ul>
      <button id="startBtn" class="btn primary big" hidden>Iniciar partida</button>
      <p id="lobbyHint" class="muted"></p>
    </section>

    <!-- Mesa -->
    <section id="screenTable" class="table" hidden>
      <div class="timer" id="timer"><div id="timerFill"></div><span id="timerText"></span></div>
      <ul id="opponents" class="opponents"></ul>

      <div class="center-area">
        <button id="drawPile" class="pile" aria-label="Robar carta">
          <div class="card back"><span>UNO</span></div>
          <small id="drawLabel">Robar</small>
        </button>
        <div class="discard">
          <div id="topCard"></div>
          <div class="meta">
            <span id="colorDot" class="color-dot"></span>
            <span id="dirLabel" class="muted"></span>
          </div>
        </div>
      </div>

      <div id="pending" class="banner" hidden></div>
      <div id="turnLabel" class="turn-label"></div>
      <div id="hand" class="hand"></div>
    </section>
  </main>

  <!-- Elegir color -->
  <div id="colorModal" class="modal" hidden>
    <div class="modal-box">
      <h2>Elige un color</h2>
      <div class="color-grid">
        <button data-color="RED" class="swatch RED" aria-label="Rojo"></button>
        <button data-color="BLUE" class="swatch BLUE" aria-label="Azul"></button>
        <button data-color="GREEN" class="swatch GREEN" aria-label="Verde"></button>
        <button data-color="YELLOW" class="swatch YELLOW" aria-label="Amarillo"></button>
      </div>
      <button id="colorCancel" class="btn ghost">Cancelar</button>
    </div>
  </div>

  <!-- Fin de partida -->
  <div id="endModal" class="modal" hidden>
    <div class="modal-box">
      <h2 id="endTitle"></h2>
      <p id="endText" class="muted"></p>
      <button id="againBtn" class="btn primary" hidden>Nueva partida</button>
      <p id="againHint" class="muted" hidden>Esperando que el anfitrión inicie otra partida…</p>
    </div>
  </div>

  <!-- Fuera de la partida -->
  <div id="awayModal" class="modal" hidden>
    <div class="modal-box">
      <h2>Estás fuera de la partida</h2>
      <p class="muted">Te saltaste varios turnos o perdiste la conexión.</p>
      <button id="rejoinBtn" class="btn primary">Volver a jugar</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js"></script>
</body>
</html>
